[project]
name = "complaint-radar"
version = "0.1.0"
description = "Turn player feedback into complaint categories, spike alerts and reply drafts."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
claude = ["anthropic>=2.12"]
dev = ["pytest", "ruff"]

[project.scripts]
radar = "radar.cli:main"

[tool.setuptools]
packages = ["radar"]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E731", "SIM108", "E501"]  # long regexes and HTML templates read better unwrapped

[tool.pytest.ini_options]
testpaths = ["tests"]
